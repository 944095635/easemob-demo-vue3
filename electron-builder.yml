# electron-builder 打包配置
# 文档：https://www.electron.build/configuration/configuration

appId: com.tielian.im
productName: 铁恋IM
copyright: Copyright © 2025 铁恋. All Rights Reserved

# 目录与入口（主进程入口从 package.json 的 "main" 字段读取）
directories:
  output: release     # 安装包输出目录
  buildResources: build

# 只打包必要文件，排除源码/测试/文档以减小体积
files:
  - electron/**/*
  - dist/**/*
  - package.json
  - '!**/node_modules/**'
  - '!src/**'
  - '!tests/**'
  - '!docs/**'
  - '!scripts/**'
  - '!public/**'
  - '!*.md'
  - '!.env*'
  - '!tsconfig*.json'
  - '!vite.config.*'
  - '!vitest.config.*'
  - '!eslint.config.*'

# 不需要随包分发 Node 生产依赖：主进程与静态服务仅用 Node 内置模块
npmRebuild: false
nodeGypRebuild: false

# 图标（build/icon.png 1024×1024，各平台由 builder 自动转换）
mac:
  icon: build/icon.png
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  category: public.app-category.social-networking

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64
        - arm64

linux:
  icon: build/icon.png
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Network
